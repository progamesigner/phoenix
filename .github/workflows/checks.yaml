name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:css

  ui-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Newest release and newest ESR. Nova is the default UI from Firefox 157; the
        # classic UI stays reachable via browser.nova.enabled=false, so cover both there.
        # 153 ESR only ships Nova as an unfinished preview behind the same pref (off by
        # default), so it runs once with UI_NOVA empty, i.e. the browser default.
        # Windows exercises the -moz-platform: windows rules in phoenix-platforms.css.
        os: [ubuntu-24.04, windows-latest]
        firefox: [157.0.1]
        nova: ["true", "false"]
        include:
          - os: ubuntu-24.04
            firefox: 153.4.0esr
          - os: windows-latest
            firefox: 153.4.0esr
    name: ui-smoke (${{ matrix.os }}, ${{ matrix.firefox }}${{ matrix.nova && format(', nova={0}', matrix.nova) || '' }})
    defaults:
      run:
        shell: bash
    env:
      # Pinned here; tests/ui/install-firefox.sh defaults to the release locally.
      FIREFOX_VERSION: ${{ matrix.firefox }}
      GECKODRIVER_VERSION: 0.37.1
      UI_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts/ui
      UI_NOVA: ${{ matrix.nova }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/ui/requirements.txt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - if: runner.os == 'Windows'
        name: Raise the screen resolution
        # The runner desktop is 1024x768, too small for the 1001px and 1400px windows
        # the tests open; tests skip widths that still do not fit.
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: pip install -r tests/ui/requirements.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache
          key: firefox-${{ runner.os }}-${{ env.FIREFOX_VERSION }}-geckodriver-${{ env.GECKODRIVER_VERSION }}
      - name: Install Firefox
        run: |
          dest="$(tests/ui/install-firefox.sh)"
          grep -E '^(Name|Version|BuildID)=' "$dest/firefox/application.ini"
          "$dest/geckodriver" --version | head -n 1
      - name: Check Firefox CSS variables
        # Firefox's CSS is the same on every platform apart from platform rules.
        if: runner.os == 'Linux'
        run: node scripts/check-firefox-vars.mjs "$(tests/ui/install-firefox.sh)/firefox"
      - name: Run UI smoke tests
        run: |
          set -o pipefail
          mkdir -p "$UI_ARTIFACTS_DIR"
          tests/ui/run.sh -v -rA --junitxml="$UI_ARTIFACTS_DIR/junit.xml" 2>&1 | tee "$UI_ARTIFACTS_DIR/pytest.log"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-smoke-failure-${{ runner.os }}-${{ matrix.firefox }}${{ matrix.nova && format('-nova-{0}', matrix.nova) || '' }}
          path: .artifacts/ui
          if-no-files-found: ignore
